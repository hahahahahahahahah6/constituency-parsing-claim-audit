[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "constituency-parsing-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for nested phrase grouping"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
constituency-parsing-claim-audit = "constituency_parsing_claim_audit.__main__:main"

[tool.setuptools]
packages = ["constituency_parsing_claim_audit", "tests"]
